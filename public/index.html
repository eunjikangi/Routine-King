<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f5f7" />
  <meta name="description" content="반복되는 생활의 주기를 대신 기억하고, 필요한 순간에 알려주는 라이프 사이클 매니저" />
  <title>Routine King — 기억하지 않아도 되는 삶</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#home" aria-label="Routine King 홈">
        <span class="brand-mark" aria-hidden="true">R</span>
        <span>Routine King</span>
      </a>

      <nav class="primary-nav" aria-label="주요 메뉴">
        <a class="nav-item" data-route="home" href="#home"><span aria-hidden="true">⌂</span> 홈</a>
        <a class="nav-item" data-route="cycles" href="#cycles"><span aria-hidden="true">↻</span> 내 사이클 <b id="cycle-count">0</b></a>
        <a class="nav-item" data-route="history" href="#history"><span aria-hidden="true">◷</span> 기록</a>
        <a class="nav-item" data-route="insights" href="#insights"><span aria-hidden="true">✦</span> 인사이트</a>
      </nav>

      <p class="nav-label">카테고리</p>
      <nav class="category-nav" id="category-nav" aria-label="카테고리"></nav>

      <div class="sidebar-bottom">
        <button class="settings" id="open-settings" type="button"><span aria-hidden="true">⚙</span> 설정</button>
        <div class="profile">
          <div class="avatar" aria-hidden="true">민</div>
          <div><strong>민지</strong><small>나만의 루틴 공간</small></div>
          <span aria-hidden="true">•••</span>
        </div>
      </div>
    </aside>
    <button class="sidebar-scrim" id="sidebar-scrim" type="button" aria-label="메뉴 닫기"></button>

    <main>
      <header class="topbar">
        <button class="mobile-menu icon-button" id="mobile-menu" type="button" aria-label="메뉴 열기">☰</button>
        <div class="page-intro">
          <p class="eyebrow" id="today-label"></p>
          <h1 id="page-title">좋은 하루예요, 민지님 <span aria-hidden="true">👋</span></h1>
        </div>
        <button class="icon-button notification-button" type="button" aria-label="알림"><span aria-hidden="true">♧</span><i></i></button>
      </header>

      <div id="app-content" tabindex="-1"></div>
    </main>

    <button class="fab" id="add-cycle" type="button"><span aria-hidden="true">＋</span> 사이클 추가</button>
  </div>

  <dialog id="catalog-dialog" class="modal catalog-dialog">
    <div class="dialog-head catalog-head">
      <div><span>CYCLE LIBRARY</span><h2>어떤 생활 주기를 기억할까요?</h2><p>카테고리를 고른 다음 필요한 항목을 선택하세요.</p></div>
      <button class="dialog-close" type="button" data-close="catalog-dialog" aria-label="닫기">×</button>
    </div>
    <label class="catalog-search"><span aria-hidden="true">⌕</span><input id="catalog-search" type="search" placeholder="항목 검색" aria-label="추가할 항목 검색" /></label>
    <nav class="catalog-tabs" id="catalog-tabs" aria-label="사이클 카테고리"></nav>
    <div class="catalog-meta"><strong id="catalog-title"></strong><span id="catalog-count"></span></div>
    <section class="catalog-grid" id="catalog-grid" aria-live="polite"></section>
  </dialog>

  <dialog id="cycle-dialog" class="modal">
    <form id="cycle-form">
      <div class="dialog-head">
        <div><span id="dialog-eyebrow">NEW CYCLE</span><h2 id="dialog-title">새로운 주기를 기억할게요</h2></div>
        <button class="dialog-close" type="button" data-close="cycle-dialog" aria-label="닫기">×</button>
      </div>
      <input id="cycle-id" type="hidden" />
      <input id="cycle-template-id" type="hidden" />
      <input id="cycle-action" type="hidden" />
      <div class="field full-field">
        <label for="cycle-name">무엇을 관리할까요?</label>
        <input id="cycle-name" name="name" maxlength="40" placeholder="예: 칫솔 교체" required />
      </div>
      <div class="form-grid">
        <div class="field emoji-field">
          <label for="cycle-emoji">아이콘</label>
          <input id="cycle-emoji" name="emoji" maxlength="4" value="✨" required />
        </div>
        <div class="field">
          <label for="cycle-category">카테고리</label>
          <select id="cycle-category" name="category" required></select>
        </div>
        <div class="field">
          <label for="cycle-interval">반복 주기</label>
          <div class="input-suffix"><input id="cycle-interval" name="interval" type="number" min="1" max="3650" value="30" required /><span>일마다</span></div>
        </div>
        <div class="field">
          <label for="cycle-last-date">마지막 완료일</label>
          <input id="cycle-last-date" name="lastDate" type="date" required />
        </div>
        <div class="field full-field">
          <label for="cycle-reminder">미리 알려주기</label>
          <div class="input-suffix"><input id="cycle-reminder" name="reminder" type="number" min="0" max="365" value="7" required /><span>일 전부터</span></div>
        </div>
      </div>
      <p class="agent-hint">✦ 주기와 마지막 완료일을 바탕으로 다음 날짜를 자동 계산해요.</p>
      <div class="dialog-actions">
        <button class="danger-button" id="delete-cycle" type="button" hidden>사이클 삭제</button>
        <button class="secondary-button" id="back-to-catalog" type="button" hidden>다른 항목 고르기</button>
        <button class="secondary-button" type="button" data-close="cycle-dialog">취소</button>
        <button class="primary-button" type="submit">사이클 저장 <span aria-hidden="true">→</span></button>
      </div>
    </form>
  </dialog>

  <dialog id="settings-dialog" class="modal settings-dialog">
    <div class="dialog-head">
      <div><span>SETTINGS</span><h2>내 데이터 관리</h2></div>
      <button class="dialog-close" type="button" data-close="settings-dialog" aria-label="닫기">×</button>
    </div>
    <p class="settings-copy">현재 사이클과 기록은 이 브라우저에만 안전하게 저장돼요.</p>
    <div class="settings-actions">
      <button id="export-data" class="settings-card" type="button"><span>↓</span><div><strong>백업 파일 받기</strong><small>모든 사이클과 기록을 JSON으로 저장</small></div></button>
      <button id="import-data" class="settings-card" type="button"><span>↑</span><div><strong>백업 불러오기</strong><small>이전에 저장한 데이터를 복원</small></div></button>
      <button id="reset-data" class="settings-card danger" type="button"><span>↺</span><div><strong>예시 데이터로 초기화</strong><small>현재 데이터는 모두 지워져요</small></div></button>
    </div>
    <input id="import-file" type="file" accept="application/json" hidden />
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-message"></span><button id="toast-action" type="button" hidden></button></div>
  <noscript><p class="noscript">Routine King을 사용하려면 JavaScript를 켜주세요.</p></noscript>
  <script src="./core.js"></script>
  <script src="./app.js"></script>
</body>
</html>
